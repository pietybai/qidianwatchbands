<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="Diagram of lug width measured between the inside faces of the lugs">
  <rect width="900" height="440" fill="#FBF9F5"/>
  <!-- watch case -->
  <rect x="340" y="70" width="220" height="220" rx="28" fill="#FFFFFF" stroke="#1C1C1C" stroke-width="3"/>
  <!-- lugs -->
  <rect x="352" y="34" width="36" height="60" rx="7" fill="#F5EFE7" stroke="#1C1C1C" stroke-width="3"/>
  <rect x="512" y="34" width="36" height="60" rx="7" fill="#F5EFE7" stroke="#1C1C1C" stroke-width="3"/>
  <!-- gap highlight -->
  <rect x="388" y="34" width="124" height="60" fill="#B4551F" opacity="0.10"/>
  <!-- dimension line -->
  <line x1="388" y1="150" x2="388" y2="220" stroke="#B4551F" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="512" y1="150" x2="512" y2="220" stroke="#B4551F" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="388" y1="196" x2="512" y2="196" stroke="#B4551F" stroke-width="3"/>
  <path d="M388 196 l14 -7 v14 z" fill="#B4551F"/>
  <path d="M512 196 l-14 -7 v14 z" fill="#B4551F"/>
  <text x="450" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#B4551F">20 mm</text>
  <text x="450" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5A554F">lug width</text>
  <!-- wrist strap hint -->
  <path d="M450 290 v58" stroke="#E2DCD2" stroke-width="3"/>
  <path d="M410 348 h80" stroke="#E2DCD2" stroke-width="3"/>
  <text x="450" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5A554F">measure the inside faces, caliper to 0.5 mm</text>
  <!-- side notes -->
  <text x="120" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A554F">case</text>
  <line x1="150" y1="132" x2="336" y2="180" stroke="#E2DCD2" stroke-width="2"/>
  <text x="770" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A554F">lug</text>
  <line x1="742" y1="80" x2="552" y2="66" stroke="#E2DCD2" stroke-width="2"/>
</svg>
